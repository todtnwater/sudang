name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 pyinstaller pillow pyobjc-framework-Quartz

      - name: Build app
        run: pyinstaller --noconfirm sudaeng_pet_mac.spec

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent sudaeng_pet.app sudaeng_pet_mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudaeng_pet_mac
          path: dist/sudaeng_pet_mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sudaeng_pet_mac.zip
